name: Build Kova ISO

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate bash scripts
        run: |
          for file in scripts/*.sh config/airootfs/usr/local/lib/kova/*; do
            bash -n "$file"
          done
      - name: Test low-battery notification thresholds (offline)
        run: bash tests/test-battery.sh
      - name: Test Wayland audio and brightness OSD (offline)
        run: bash tests/test-osd.sh
      - name: Test mirror updater without network
        run: bash tests/test-mirrors.sh
      - name: Test offline ISO size report generator
        run: bash tests/test-size-report.sh
      - name: Validate live DE/EN language and documentation exclusions
        run: bash tests/test-live-content-policy.sh
      - name: Test offline wallpaper pool and five-boot rotation
        run: bash tests/test-wallpaper-pool.sh
      - name: Validate Kova terminal logo in Live and installed profiles
        run: bash tests/test-fetch-branding.sh
      - name: Check initrd identity, renderer, and release wiring
        run: bash tests/test-v0.1.0-wiring.sh
      - name: Check live ISO package policy for Neovim
        run: bash tests/test-live-package-policy.sh
      - name: Ensure production ISO excludes CI smoke infrastructure
        run: bash tests/test-iso-flavors.sh
      - name: Test production boot serial detection against real QEMU logs
        run: bash tests/test-production-boot.sh
      - name: Test quiet live boot policy and logind tty1 proof
        run: bash tests/test-quiet-live.sh
      - name: Test safe macOS QEMU launcher
        run: bash tests/test-qemu-macos.sh
      - name: Check live banner and installer ordering
        run: bash tests/test-installer-static.sh
      - name: Validate Kova font and terminal settings
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib
          from xml.etree import ElementTree
          root = pathlib.Path("config/airootfs")
          terminal = tomllib.loads((root / "etc/skel/.config/alacritty/alacritty.toml").read_text())
          assert terminal["font"]["normal"]["family"] == "JetBrains Mono"
          ElementTree.parse(root / "etc/fonts/conf.d/70-kova-monospace.conf")
          print("Fontconfig XML and Alacritty TOML validated")
          PY
      - name: Verify browser MIME defaults and installation declarations
        run: |
          python3 - <<'PY'
          import configparser
          from pathlib import Path
          cfg = configparser.ConfigParser(interpolation=None)
          cfg.read("config/airootfs/etc/xdg/mimeapps.list")
          defaults = cfg["Default Applications"]
          for mime in ("x-scheme-handler/http", "x-scheme-handler/https", "text/html", "application/xhtml+xml"):
              assert defaults[mime] == "librewolf.desktop;", mime
          for path in ("scripts/build.sh", "scripts/install-system.sh"):
              content = Path(path).read_text()
              assert "librewolf" in content and "xdg-utils" in content, path
          assert 'install -Dm644 /etc/xdg/mimeapps.list' in Path("scripts/install-system.sh").read_text()
          print("LibreWolf default MIME handlers and packages verified")
          PY
      - name: Validate Fish configuration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fish
          for file in config/airootfs/etc/fish/conf.d/*.fish; do
            fish -n "$file"
          done
          # Test the distro-provided Tide values without installing Tide or writing
          # persistent Fish variables into the runner user's actual home.
          isolated=$(mktemp -d)
          trap 'rm -rf "$isolated"' EXIT
          XDG_CONFIG_HOME="$isolated" fish -c '
            source config/airootfs/etc/fish/conf.d/kova-tide.fish
            __kova_tide_defaults
            test (string join " " $tide_left_prompt_items) = "pwd git character"; or exit 1
            test "$tide_character_icon" = "❯"; or exit 1
            test "$tide_git_color_branch" = "5FD700"; or exit 1
            test "$tide_prompt_add_newline_before" = "false"; or exit 1
            test (count $tide_right_prompt_items) -gt 10; or exit 1
            test "$tide_cmd_duration_icon" = ""; or exit 1
            set -U tide_git_color_branch AABBCC
            __kova_tide_defaults
            test "$tide_git_color_branch" = "AABBCC"; or exit 1
            echo "Kova Tide defaults and per-user overrides passed"
          '

  rust:
    name: Rust workspace tests and binary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust toolchain
        run: |
          cargo --version
          rustc --version
      - name: Test installer planning
        run: cargo test --locked --workspace
      - name: Build Kova CLI
        run: |
          cargo build --locked --release --package kova-cli
          target/release/kova --help
          target/release/kova install --dry-run --demo | grep -q 'NO PARTITIONS OR FILES WERE MODIFIED'
      - name: Test keyboard TUI in actual pseudoterminals (no disk writes)
        run: python3 tests/test-installer-tui-pty.py target/release/kova
      - name: Publish binary for ISO build
        uses: actions/upload-artifact@v4
        with:
          name: kova-cli-binary
          path: target/release/kova
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build Archiso
    needs: [checks, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve tested Kova CLI
        uses: actions/download-artifact@v4
        with:
          name: kova-cli-binary
          path: kova-binary
      - name: Stage Kova CLI in the ISO root filesystem
        run: |
          install -Dm755 kova-binary/kova config/airootfs/usr/local/bin/kova
      - name: Build ISO using Arch Linux toolchain
        run: |
          docker run --rm --privileged \
            -v "$PWD:/repo" -w /repo \
            archlinux:latest bash -euc '
              pacman -Syu --noconfirm --needed archiso curl git
              bash scripts/install-tide.sh config/airootfs
              bash scripts/install-neovim-config.sh
              bash scripts/install-rust-search.sh config/airootfs
              bash scripts/install-anvil.sh config/airootfs
              bash scripts/install-wallpapers.sh config/airootfs
              install -Dm755 scripts/install-system.sh config/airootfs/usr/local/lib/kova/install-system
              # First build the exact clean public ISO, then a distinct CI-only
              # guest image with the smoke-test systemd service injected.
              bash scripts/build.sh
              # The production ISO and size report are already materialized;
              # release its staging rootfs before the second build to avoid
              # exceeding GitHub runner disk space (two >4-GiB rootfs trees).
              rm -rf /tmp/kova-archiso-work
              KOVA_CI_IMAGE=1 KOVA_OUT_DIR=/repo/out-ci KOVA_WORK=/tmp/kova-archiso-ci-work bash scripts/build.sh
              rm -rf /tmp/kova-archiso-ci-work
            '
      - name: Validate outputs
        run: |
          test -n "$(find out -maxdepth 1 -name '*.iso' -print -quit)"
          (cd out && sha256sum -c SHA256SUMS)
          (cd out-ci && sha256sum -c SHA256SUMS)
          test "$(find out -maxdepth 1 -name '*.iso' | wc -l)" -eq 1
          test "$(find out-ci -maxdepth 1 -name '*.iso' | wc -l)" -eq 1
      - name: Publish ISO size audit
        run: |
          test -s out/SIZE_REPORT.md
          cat out/SIZE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload size audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: kova-size-report
          path: out/SIZE_REPORT.md
          if-no-files-found: error
          retention-days: 30
      - name: Upload ISO for boot verification
        uses: actions/upload-artifact@v4
        with:
          name: kova-iso
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload instrumented CI-only ISO
        uses: actions/upload-artifact@v4
        with:
          name: kova-ci-iso
          path: out-ci/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  boot:
    name: QEMU live system smoke tests (BIOS and UEFI)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve ISO from build
        uses: actions/download-artifact@v4
        with:
          name: kova-iso
          path: out/
      - name: Retrieve CI-only guest image
        uses: actions/download-artifact@v4
        with:
          name: kova-ci-iso
          path: out-ci/
      - name: Verify transferred ISOs
        run: |
          (cd out && sha256sum -c SHA256SUMS)
          (cd out-ci && sha256sum -c SHA256SUMS)
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Boot instrumented CI guest and run full smoke tests
        run: KOVA_TEST_MODE=ci KOVA_TEST_ISO_DIR="$PWD/out-ci" bash scripts/test-iso.sh
      - name: Boot exact production ISO using BIOS
        run: KOVA_TEST_MODE=production KOVA_TEST_FIRMWARE=bios KOVA_TEST_ISO_DIR="$PWD/out" bash scripts/test-iso.sh
      - name: Boot exact production ISO using OVMF/UEFI
        run: KOVA_TEST_MODE=production KOVA_TEST_FIRMWARE=uefi KOVA_TEST_ISO_DIR="$PWD/out" bash scripts/test-iso.sh
      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kova-qemu-logs
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish verified release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: boot
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kova-iso
          path: out/
      - name: Verify release assets
        run: (cd out && sha256sum -c SHA256SUMS)
      - name: Publish Kova v0.1.0 from the ISO already boot-tested
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Never replace an already-published release; no extra tagged build.
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Kova v0.1.0 already published."
            exit 0
          fi
          iso=$(find out -maxdepth 1 -name '*.iso' -type f -print -quit)
          test -n "$iso"
          test "$(stat -c '%s' "$iso")" -lt 2147483648
          gh release create v0.1.0 "$iso" out/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Kova Linux v0.1.0" \
            --notes "First experimental Kova Linux release: Anvil, LibreWolf, TTY installer and Kova terminal branding. Tested as BIOS and UEFI live ISO. Full-disk installation only; back up your data before use."
