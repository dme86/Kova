name: Build Kova ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate bash scripts
        run: |
          for file in scripts/*.sh config/airootfs/usr/local/lib/kova/*; do
            bash -n "$file"
          done
      - name: Test Wayland audio and brightness OSD (offline)
        run: bash tests/test-osd.sh
      - name: Test mirror updater without network
        run: bash tests/test-mirrors.sh
      - name: Validate Fish configuration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fish
          for file in config/airootfs/etc/fish/conf.d/*.fish; do
            fish -n "$file"
          done

  rust:
    name: Rust workspace tests and binary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust toolchain
        run: |
          cargo --version
          rustc --version
      - name: Test installer planning
        run: cargo test --locked --workspace
      - name: Build Kova CLI
        run: |
          cargo build --locked --release --package kova-cli
          target/release/kova --help
          target/release/kova install --dry-run --demo | grep -q 'NO PARTITIONS OR FILES WERE MODIFIED'
      - name: Publish binary for ISO build
        uses: actions/upload-artifact@v4
        with:
          name: kova-cli-binary
          path: target/release/kova
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build Archiso
    needs: [checks, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve tested Kova CLI
        uses: actions/download-artifact@v4
        with:
          name: kova-cli-binary
          path: kova-binary
      - name: Stage Kova CLI in the ISO root filesystem
        run: |
          install -Dm755 kova-binary/kova config/airootfs/usr/local/bin/kova
      - name: Build ISO using Arch Linux toolchain
        run: |
          docker run --rm --privileged \
            -v "$PWD:/repo" -w /repo \
            archlinux:latest bash -euc '
              pacman -Syu --noconfirm --needed archiso curl git
              bash scripts/install-tide.sh config/airootfs
              bash scripts/install-neovim-config.sh
              bash scripts/install-rust-search.sh config/airootfs
              bash scripts/install-anvil.sh config/airootfs
              bash scripts/install-wallpapers.sh config/airootfs
              install -Dm755 scripts/install-system.sh config/airootfs/usr/local/lib/kova/install-system
              bash scripts/build.sh
            '
      - name: Validate outputs
        run: |
          test -n "$(find out -maxdepth 1 -name '*.iso' -print -quit)"
          (cd out && sha256sum -c SHA256SUMS)
      - name: Upload ISO for boot verification
        uses: actions/upload-artifact@v4
        with:
          name: kova-iso
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  boot:
    name: QEMU live system smoke tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve ISO from build
        uses: actions/download-artifact@v4
        with:
          name: kova-iso
          path: out/
      - name: Verify transferred ISO
        run: (cd out && sha256sum -c SHA256SUMS)
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Boot Kova and run smoke tests
        run: bash scripts/test-iso.sh
      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kova-qemu-logs
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: boot
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kova-iso
          path: out/
      - name: Verify release assets
        run: (cd out && sha256sum -c SHA256SUMS)
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.iso out/SHA256SUMS \
            --generate-notes --title "Kova Linux $GITHUB_REF_NAME"
