name: Build Kova ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh
          bash -n config/airootfs/usr/local/lib/kova/*

      - name: Build ISO using Arch Linux toolchain
        run: |
          docker run --rm --privileged \
            -v "$PWD:/repo" -w /repo \
            archlinux:latest bash -euc '
              pacman -Syu --noconfirm --needed archiso curl git fish
              fish -n config/airootfs/etc/fish/conf.d/*.fish
              bash scripts/install-tide.sh config/airootfs
              bash scripts/install-neovim-config.sh
              bash scripts/build.sh
            '

      - name: Validate outputs
        run: |
          test -n "$(find out -maxdepth 1 -name '*.iso' -print -quit)"
          (cd out && sha256sum -c SHA256SUMS)

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Boot Kova and run smoke tests
        run: bash scripts/test-iso.sh

      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kova-qemu-logs
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: kova-iso
          path: out/
          if-no-files-found: error
          retention-days: 7

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.iso out/SHA256SUMS \
            --generate-notes --title "Kova Linux $GITHUB_REF_NAME"
